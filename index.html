<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VendreIA</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      line-height: 1.6;
    }

    input, textarea, select {
      width: 100%;
      padding: 14px;
      margin: 8px 0 16px;
      border: 1px solid #ddd;
      border-radius: 10px;
      box-sizing: border-box;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #111827;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <header>
    <h1>🚀 VendreIA</h1>
    <p>Vendez mieux avec l'intelligence artificielle</p>
  </header>

  <div class="container">
    <div class="card">

      <h2>✨ Créez votre contenu de vente</h2>

      <label>Nom du produit</label>
      <input type="text" placeholder="Ex : Chaussures homme">

      <label>Prix</label>
      <input type="text" placeholder="Ex : 15 000 FCFA">

      <label>Décrivez votre produit</label>
      <textarea rows="4" placeholder="Décrivez votre produit..."></textarea>

      <label>Type de contenu</label>
      <select>
        <option>Publicité Facebook</option>
        <option>Message WhatsApp</option>
        <option>Script TikTok</option>
        <option>Description produit</option>
        <option>Réponse client</option>
      </select>

      <button>✨ Générer avec l'IA</button>

    </div>
  </div>

</body>
</html>
